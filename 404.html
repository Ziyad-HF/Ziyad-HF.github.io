<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Ziyad ElFayoumy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/shared/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f7f5f0; --fg: #1d2321; --muted: #5a6662; --accent: #0f766e; --a: #000; --b: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #181818; --fg: #eee; --muted: #a3a3a3; --accent: #2dd4bf; --a: #fff; --b: #9b9b9b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 400 16px/24px "Geist", system-ui, sans-serif; text-align: center; }
    .code { font: 500 14px/20px "Geist Mono", monospace; color: var(--accent); margin: 0 0 16px; }
    h1 { font-size: 48px; line-height: 48px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 16px; text-wrap: balance; background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); max-width: 440px; margin: 0 auto 32px; text-wrap: pretty; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 16px; border-radius: 9999px; font-weight: 600; text-decoration: none; border: 1px solid var(--accent); color: var(--accent); transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1); }
    a.primary { background: var(--accent); color: var(--bg); }
    a:hover { transform: translateY(-2px); } a:active { transform: scale(0.98); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 600px) { h1 { font-size: 36px; line-height: 40px; } }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This stop is not on the map</h1>
    <p>The page you were looking for has moved or never existed. The rest of the journey is one click away.</p>
    <div class="row">
      <a class="primary" href="/">Back to the homepage</a>
      <a href="/cloud/">3D version</a>
    </div>
  </main>
</body>
</html>
